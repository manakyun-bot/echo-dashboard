<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070A0F">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=M+PLUS+1p:wght@300;400;700&family=M+PLUS+Rounded+1c:wght@300;400;700&family=Noto+Sans+JP:wght@300;400;700&family=Noto+Serif+JP:wght@300;400;700&family=RocknRoll+One&family=Shippori+Mincho&family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
/* ===== 全体で使う色・サイズの変数（CONFIGにあたる部分） ===== */
:root{
  --bg:#070A0F; --surface:rgba(255,255,255,.055); --line:rgba(255,255,255,.09);
  --muted:#7E8894; --rain:#6FB4E8; --warm:#E8B06F;
  --fg:#EEF1F5; --clock-size:200px; --date-size:34px;
  --vpos:center; --hpos:flex-start; --talign:left;
  --night-fg:#2A3138;
  --hh-color:#EEF1F5; --mm-color:#EEF1F5; --ss-color:#7E8894;
  --date-md-color:#7E8894; --date-dow-color:#EEF1F5;
  --temp-color:#EEF1F5; --desc-color:#EEF1F5; --hilo-color:#7E8894; --hourfc-color:#EEF1F5;
  --weather-scale:1;
  --clock-font:"Roboto","Noto Sans CJK JP","Droid Sans Japanese",sans-serif;
  --date-font:"Roboto","Noto Sans CJK JP","Droid Sans Japanese",sans-serif;
  --cal-scale:1; --cal-sun-color:#E8706F; --cal-sat-color:#6F9EE8; --cal-holiday-color:#E8706F;
  --bg-dark:.45;
}

/* ===== 全体のリセット・基本スタイル ===== */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden;position:relative;
  font-family:"Roboto","Noto Sans CJK JP","Droid Sans Japanese",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}

/* ===== 背景画像（時間帯＋天気で自動切り替え、2枚重ねでクロスフェード） ===== */
.bgLayer{position:fixed;inset:0;background-size:cover;background-position:center;
  background-repeat:no-repeat;opacity:0;transition:opacity 1.6s ease;z-index:0;}
.bgLayer.on{opacity:1;}
#bgOverlay{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:rgba(0,0,0,var(--bg-dark));}
#screen{position:relative;z-index:1;}

/* ===== 画面全体のレイアウト（時計日付／カレンダー／天気／これからの天気を十字に4分割） ===== */
#screen{position:absolute;top:0;left:0;width:1280px;height:800px;
  transform-origin:0 0;display:flex;flex-direction:column;padding:40px 56px;gap:20px;
  overflow:hidden;}
#board{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:26px;}
.cell{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;overflow:hidden;}
/* 下部：将来ニュースを横スクロール表示するためのスペース（現状はプレースホルダー） */
#newsBar{flex:none;height:56px;display:flex;align-items:center;justify-content:center;
  border-top:1px solid var(--line);color:var(--muted);font-size:19px;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;}

/* 天気を非表示にしたときは、時計とカレンダーの2エリアだけを縦に並べる */
body.noweather #board{grid-template-columns:1fr;grid-template-rows:1fr 1fr;}
body.noweather #cellWeather,body.noweather #cellHours{display:none;}

/* ===== 時計・日付エリア ===== */
#cellClock{align-items:var(--hpos);justify-content:var(--vpos);text-align:var(--talign);}
#left{display:flex;flex-direction:column;align-items:inherit;text-align:inherit;}

#clock{font-family:var(--clock-font);font-size:var(--clock-size);font-weight:200;line-height:.92;letter-spacing:-.035em;font-variant-numeric:tabular-nums;}
#hh{color:var(--hh-color);}
#mm{color:var(--mm-color);}
#sec{font-size:.32em;font-weight:300;color:var(--ss-color);letter-spacing:0;margin-left:.06em;}
body.nosec #sec{display:none;}
#date{margin-top:22px;font-size:var(--date-size);font-weight:300;font-family:var(--date-font);
  align-self:center;text-align:center;}
#md{color:var(--date-md-color);}
#dow{color:var(--date-dow-color);}

/* ===== 左側：カレンダー（月表示・日曜始まり） ===== */
#cal{width:min(100%,calc(360px*var(--cal-scale)));}
.calHead,.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:calc(4px*var(--cal-scale));}
.calHead div{text-align:center;font-size:calc(15px*var(--cal-scale));color:var(--muted);padding-bottom:calc(6px*var(--cal-scale));}
.calHead .sun{color:var(--cal-sun-color);}
.calHead .sat{color:var(--cal-sat-color);}
.calGrid{margin-top:calc(2px*var(--cal-scale));}
.calCell{text-align:center;padding:calc(5px*var(--cal-scale)) 0;font-size:calc(18px*var(--cal-scale));
  font-variant-numeric:tabular-nums;border-radius:8px;}
.calCell.other{opacity:.25;}
.calCell.sun{color:var(--cal-sun-color);}
.calCell.sat{color:var(--cal-sat-color);}
.calCell.holiday{color:var(--cal-holiday-color);}
.calCell.today{background:rgba(255,255,255,.14);font-weight:500;}
body.nocal #cal{display:none;}
body.night #cal{display:none;}

/* ===== 天気カード（現在の天気） ===== */
.card{width:100%;max-width:460px;}
#cellHours{width:100%;}
#nowRow{display:flex;align-items:center;justify-content:center;gap:30px;text-align:center;}
#nowRow>div:last-child{display:flex;flex-direction:column;align-items:center;}
#icon{width:calc(108px*var(--weather-scale));height:calc(108px*var(--weather-scale));flex:none;color:var(--temp-color);}
#temp{font-size:calc(92px*var(--weather-scale));font-weight:200;line-height:1;font-variant-numeric:tabular-nums;color:var(--temp-color);}
#temp span{font-size:calc(40px*var(--weather-scale));color:var(--muted);}
#desc{font-size:calc(34px*var(--weather-scale));font-weight:300;margin-top:8px;color:var(--desc-color);}
#hilo{font-size:calc(24px*var(--weather-scale));color:var(--hilo-color);margin-top:10px;text-align:center;}
#hilo b{font-weight:400;color:var(--fg);}

/* ===== 右側：時間ごとの予報カード ===== */
#hours{display:flex;justify-content:space-between;}
.hour{text-align:center;flex:1;}
.hour .h{font-size:calc(22px*var(--weather-scale));color:var(--muted);}
.hour svg{width:calc(42px*var(--weather-scale));height:calc(42px*var(--weather-scale));margin:calc(10px*var(--weather-scale)) 0 calc(6px*var(--weather-scale));}
.hour .t{font-size:calc(28px*var(--weather-scale));font-weight:300;font-variant-numeric:tabular-nums;color:var(--hourfc-color);}
.hour .p{font-size:calc(20px*var(--weather-scale));color:var(--rain);min-height:calc(26px*var(--weather-scale));}

/* ===== 右側：降水確率アラート（「○時ごろから雨」） ===== */
#alert{display:none;padding:calc(16px*var(--weather-scale)) calc(22px*var(--weather-scale));border-left:3px solid var(--rain);
  background:rgba(111,180,232,.10);font-size:calc(27px*var(--weather-scale));color:var(--rain);border-radius:0 6px 6px 0;}
#alert.on{display:block;}

/* ===== 右側：通信エラー時の注意書き ===== */
#note{display:none;font-size:20px;line-height:1.5;color:var(--warm);}
#note.on{display:block;}

/* ===== 夜間モード（時計のみ・暗いグレー表示に切り替え） ===== */
body.night #cellCal,body.night #cellWeather,body.night #cellHours,body.night #newsBar{display:none;}
body.night #board{grid-template-columns:1fr;grid-template-rows:1fr;}
body.night #cellClock{grid-column:1/-1;grid-row:1/-1;align-items:center;justify-content:center;text-align:center;}
body.night #screen{padding:0;gap:0;}
body.night #clock{font-size:120px;color:var(--night-fg);}
body.night #hh,body.night #mm{color:var(--night-fg);}
body.night #sec{display:none;}
body.night #date{font-size:24px;color:var(--night-fg);opacity:.6;}
body.night #md,body.night #dow{color:var(--night-fg);}

/* ===== 縦置き（ポートレート）レイアウト：時計日付／カレンダー／天気／これからの天気を縦に4分割 ===== */
body.portrait #screen{position:fixed;inset:0;width:100vw;height:100vh;
  display:flex;flex-direction:column;padding:8vh 6vw;gap:2.2vh;}
body.portrait #board{grid-template-columns:1fr;grid-template-rows:repeat(4,1fr);gap:1.8vh;}
body.portrait.noweather #board{grid-template-rows:1fr 1fr;}
body.portrait .cell{gap:1vh;}
/* 縦置きのときだけ「時計＋日付→カレンダー→天気→これからの天気」の順にする
   （横置きはHTMLの並び順＝時計→天気→カレンダー→これからの天気のまま変更しない） */
body.portrait #cellClock{order:1;}
body.portrait #cellCal{order:2;}
body.portrait #cellWeather{order:3;}
body.portrait #cellHours{order:4;}
body.portrait #cal{width:min(92vw,380px);}
body.portrait .card{max-width:92vw;}
body.portrait #alert,body.portrait #note{width:100%;max-width:92vw;}

/* 「縦置き時に自動でバランス調整する」がONのとき、4分割された各セルの高さ（vh）を基準に
   サイズを自動計算する。天気の大きさ／カレンダーの大きさスライダー（--weather-scale／
   --cal-scale）を掛け合わせているので、自動調整ONのままでもスライダーでさらに
   小さく・大きく調整できる（以前はスライダーが効かなかった問題の修正） */
body.portrait-auto #clock{font-size:clamp(48px,11vh,150px);}
body.portrait-auto #date{font-size:clamp(15px,2.4vh,26px);margin-top:min(1.4vh,14px);}
body.portrait-auto #cal{width:min(90vw,360px);}
body.portrait-auto .calHead div{font-size:calc(clamp(11px,1.8vh,16px)*var(--cal-scale));}
body.portrait-auto .calCell{font-size:calc(clamp(13px,2.2vh,19px)*var(--cal-scale));
  padding:calc(clamp(2px,.6vh,6px)*var(--cal-scale)) 0;}
body.portrait-auto .card{padding:calc(clamp(10px,1.6vh,20px)*var(--weather-scale)) calc(clamp(12px,2vw,22px)*var(--weather-scale));}
body.portrait-auto #icon{width:calc(clamp(46px,9vh,96px)*var(--weather-scale));height:calc(clamp(46px,9vh,96px)*var(--weather-scale));}
body.portrait-auto #temp{font-size:calc(clamp(38px,9vh,74px)*var(--weather-scale));}
body.portrait-auto #temp span{font-size:calc(clamp(18px,4vh,34px)*var(--weather-scale));}
body.portrait-auto #desc{font-size:calc(clamp(15px,3vh,26px)*var(--weather-scale));}
body.portrait-auto #hilo{font-size:calc(clamp(12px,2vh,19px)*var(--weather-scale));}
body.portrait-auto #cellHours{gap:calc(clamp(5px,1vh,12px)*var(--weather-scale));}
body.portrait-auto .hour .h{font-size:calc(clamp(12px,1.8vh,18px)*var(--weather-scale));}
body.portrait-auto .hour .t{font-size:calc(clamp(14px,2.2vh,22px)*var(--weather-scale));}
body.portrait-auto .hour .p{font-size:calc(clamp(11px,1.6vh,16px)*var(--weather-scale));min-height:calc(clamp(14px,2vh,20px)*var(--weather-scale));}
body.portrait-auto .hour svg{width:calc(clamp(20px,3.8vh,34px)*var(--weather-scale));height:calc(clamp(20px,3.8vh,34px)*var(--weather-scale));
  margin:calc(clamp(4px,1vh,8px)*var(--weather-scale)) 0 calc(clamp(3px,.6vh,5px)*var(--weather-scale));}
body.portrait-auto #alert{font-size:calc(clamp(12px,1.8vh,18px)*var(--weather-scale));
  padding:calc(clamp(7px,1.2vh,12px)*var(--weather-scale)) calc(clamp(9px,1.6vh,16px)*var(--weather-scale));}
body.portrait-auto #note{font-size:clamp(11px,1.6vh,15px);}

/* 夜間モード×縦置きが同時のときは、常に夜間の全画面時計レイアウトを優先する */
body.night.portrait #screen{padding:0;gap:0;}
body.night.portrait #board{grid-template-columns:1fr;grid-template-rows:1fr;}

/* ===== 設定パネル ===== */
#panel{position:fixed;inset:0;background:rgba(4,6,10,.94);z-index:50;display:none;
  overflow-y:auto;padding:36px 44px;-webkit-overflow-scrolling:touch;}
#panel.on{display:block;}
#panel h2{font-size:30px;font-weight:300;margin-bottom:6px;}
#panel .lead{font-size:19px;color:var(--muted);margin-bottom:26px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 40px;}
.row{display:flex;align-items:center;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);}
.row label{flex:1;font-size:21px;font-weight:300;}
.row .val{font-size:19px;color:var(--muted);min-width:66px;text-align:right;font-variant-numeric:tabular-nums;}
input[type=range]{width:210px;}
input[type=color]{width:60px;height:36px;background:none;border:1px solid var(--line);border-radius:6px;padding:2px;}
input[type=number]{width:120px;font-size:19px;padding:7px 9px;background:#12171F;color:var(--fg);
  border:1px solid var(--line);border-radius:6px;}
select{font-size:19px;padding:7px 9px;background:#12171F;color:var(--fg);border:1px solid var(--line);border-radius:6px;}
input[type=checkbox]{width:24px;height:24px;}
.seg{display:flex;gap:6px;}
.seg button{font-size:18px;padding:8px 15px;background:#12171F;color:var(--muted);
  border:1px solid var(--line);border-radius:6px;font-family:inherit;}
.seg button.sel{background:#243040;color:var(--fg);border-color:#3C4A5C;}
#panelFoot{display:flex;gap:14px;margin-top:30px;padding-bottom:20px;}
#panelFoot button{font-size:22px;font-weight:300;padding:14px 30px;border-radius:8px;
  border:1px solid var(--line);background:#12171F;color:var(--fg);font-family:inherit;}
#panelFoot .primary{background:#2A6FA8;border-color:#2A6FA8;}
#panelFoot .ghost{color:var(--muted);}
.sec{font-size:17px;color:var(--muted);margin:26px 0 4px;}
#hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;font-size:17px;color:#2A3138;}
body.night #hint{display:none;}
</style>
</head>
<body>

<div id="bg1" class="bgLayer"></div>
<div id="bg2" class="bgLayer"></div>
<div id="bgOverlay"></div>

<div id="screen">
  <div id="board">
    <div class="cell" id="cellClock">
      <div id="left">
        <div id="clock"><span id="hh">--</span>:<span id="mm">--</span><span id="sec">00</span></div>
        <div id="date">読み込み中</div>
      </div>
    </div>
    <div class="cell" id="cellWeather">
      <div class="card">
        <div id="nowRow">
          <div id="icon"></div>
          <div>
            <div id="temp">--<span>°</span></div>
            <div id="desc">天気を取得しています</div>
          </div>
        </div>
        <div id="hilo"></div>
      </div>
    </div>
    <div class="cell" id="cellCal">
      <div id="cal"></div>
    </div>
    <div class="cell" id="cellHours">
      <div class="card" id="hours"></div>
      <div id="alert"></div>
      <div id="note"></div>
    </div>
  </div>
  <div id="newsBar"><span>ニュース欄（今後、横スクロールのニュースをここに表示予定）</span></div>
</div>

<div id="hint">画面を長押しすると設定が開きます</div>

<div id="panel">
  <h2>設定</h2>
  <div class="lead">変更はその場で画面に反映されます。保存すると次回も残ります。</div>

  <div class="grid">
    <div>
      <div class="sec">時計と日付</div>
      <div class="row"><label>時計の大きさ</label>
        <input type="range" id="sClock" min="70" max="340" step="5"><span class="val" id="vClock"></span></div>
      <div class="row"><label>日付の大きさ</label>
        <input type="range" id="sDate" min="16" max="90" step="2"><span class="val" id="vDate"></span></div>
      <div class="row"><label>文字の色（基本）</label>
        <input type="color" id="sFg"><span class="val" id="vFg"></span></div>
      <div class="row"><label>秒を表示する</label><input type="checkbox" id="sSec"></div>
      <div class="row"><label>時刻のフォント</label>
        <select id="sClockFont"></select></div>
      <div class="row"><label>日付のフォント</label>
        <select id="sDateFont"></select></div>

      <div class="sec">時計・日付の色（個別）</div>
      <div class="row"><label>時の色</label><input type="color" id="sHourColor"></div>
      <div class="row"><label>分の色</label><input type="color" id="sMinColor"></div>
      <div class="row"><label>秒の色</label><input type="color" id="sSecColor"></div>
      <div class="row"><label>月日の色</label><input type="color" id="sDateColor"></div>
      <div class="row"><label>曜日の色</label><input type="color" id="sDowColor"></div>

      <div class="sec">表示位置</div>
      <div class="row"><label>横</label>
        <div class="seg" id="segH">
          <button data-v="flex-start">左</button><button data-v="center">中央</button><button data-v="flex-end">右</button>
        </div></div>
      <div class="row"><label>縦</label>
        <div class="seg" id="segV">
          <button data-v="flex-start">上</button><button data-v="center">中央</button><button data-v="flex-end">下</button>
        </div></div>

      <div class="sec">縦置き（ポートレート）</div>
      <div class="row"><label>画面の高さから自動計算する（ON）／下の縦置き専用サイズを使う（OFF）</label><input type="checkbox" id="sPortraitAuto"></div>
      <div class="row"><label>縦置き時の時計の大きさ</label>
        <input type="range" id="sPortraitClock" min="60" max="260" step="5"><span class="val" id="vPortraitClock"></span></div>
      <div class="row"><label>縦置き時の日付の大きさ</label>
        <input type="range" id="sPortraitDate" min="14" max="70" step="2"><span class="val" id="vPortraitDate"></span></div>
      <div class="row"><label>縦置き時の天気の大きさ</label>
        <input type="range" id="sPortraitWeatherScale" min="50" max="160" step="5"><span class="val" id="vPortraitWeatherScale"></span></div>
      <div class="row"><label>縦置き時のカレンダーの大きさ</label>
        <input type="range" id="sPortraitCalScale" min="50" max="160" step="5"><span class="val" id="vPortraitCalScale"></span></div>
      <div class="lead" style="margin:6px 0 0">横置き時の大きさは上の「時計と日付」「カレンダー」「天気の見た目」の数値がそのまま使われます。ここは縦置き専用です。</div>

      <div class="sec">カレンダー</div>
      <div class="row"><label>カレンダーを表示する</label><input type="checkbox" id="sCalOn"></div>
      <div class="row"><label>カレンダーの大きさ</label>
        <input type="range" id="sCalScale" min="60" max="160" step="5"><span class="val" id="vCalScale"></span></div>
      <div class="row"><label>日曜日の色</label><input type="color" id="sCalSun"></div>
      <div class="row"><label>土曜日の色</label><input type="color" id="sCalSat"></div>
      <div class="row"><label>祝日の色</label><input type="color" id="sCalHoliday"></div>
    </div>

    <div>
      <div class="sec">夜間モード</div>
      <div class="row"><label>夜間モードを使う</label><input type="checkbox" id="sNightOn"></div>
      <div class="row"><label>開始</label><select id="sNightStart"></select></div>
      <div class="row"><label>終了</label><select id="sNightEnd"></select></div>
      <div class="row"><label>夜間の明るさ</label>
        <input type="range" id="sNightBr" min="0" max="70" step="2"><span class="val" id="vNightBr"></span></div>

      <div class="sec">天気</div>
      <div class="row"><label>天気を表示する</label><input type="checkbox" id="sWeatherOn"></div>
      <div class="row"><label>緯度</label><input type="number" id="sLat" step="0.0001"></div>
      <div class="row"><label>経度</label><input type="number" id="sLon" step="0.0001"></div>
      <div class="row"><label>更新間隔（分）</label><input type="number" id="sRefresh" min="5" max="120" step="5"></div>
      <div class="row"><label>雨の通知（降水確率%）</label><input type="number" id="sRain" min="10" max="100" step="10"></div>

      <div class="sec">天気の見た目</div>
      <div class="row"><label>天気の大きさ</label>
        <input type="range" id="sWeatherScale" min="60" max="160" step="5"><span class="val" id="vWeatherScale"></span></div>
      <div class="row"><label>気温の色</label><input type="color" id="sTempColor"></div>
      <div class="row"><label>天気の説明の色</label><input type="color" id="sDescColor"></div>
      <div class="row"><label>最高/最低/体感の色</label><input type="color" id="sHiloColor"></div>
      <div class="row"><label>時間ごとの予報の色</label><input type="color" id="sHourFcColor"></div>

      <div class="sec">背景画像</div>
      <div class="row"><label>背景画像を表示する</label><input type="checkbox" id="sBgOn"></div>

<script>
"use strict";
var $ = function(id){ return document.getElementById(id); };

/* ===== フォントの選択肢（キー→実際のfont-family値／表示名） ===== */
/* 「Android専用」と書いたものはタブレット実機でのみ見た目が変わり、
   PCのブラウザではsans-serifと同じに見えます（見た目確認はNoto/Kosugi等を推奨）。*/
var FONT_MAP = [
  ["default","既定",'"Roboto","Noto Sans CJK JP","Droid Sans Japanese",sans-serif'],
  ["gothic","ゴシック体（Noto Sans）","'Noto Sans JP',sans-serif"],
  ["mincho","明朝体（Noto Serif）","'Noto Serif JP',serif"],
  ["round","丸ゴシック（コスギ丸）","'Kosugi Maru',sans-serif"],
  ["mplus_round","丸ゴシック（M PLUS Rounded）","'M PLUS Rounded 1c',sans-serif"],
  ["mplus","モダンゴシック（M PLUS）","'M PLUS 1p',sans-serif"],
  ["shippori","上品な明朝（しっぽり明朝）","'Shippori Mincho',serif"],
  ["pop","ポップ体（RocknRoll One）","'RocknRoll One',sans-serif"],
  ["brush","筆文字風（游習字）","'Yuji Syuku',serif"],
  ["serif","セリフ（欧文）","serif"],
  ["mono","等幅","monospace"],
  ["condensed","コンデンス（Android専用）","sans-serif-condensed,sans-serif"],
  ["thin","細字（Android専用）","sans-serif-thin,sans-serif"]
];
var FONT_CSS = {};
(function(){ for(var i=0;i<FONT_MAP.length;i++) FONT_CSS[FONT_MAP[i][0]] = FONT_MAP[i][2]; })();
function fillFontSelect(id){
  var o="";
  for(var i=0;i<FONT_MAP.length;i++) o+='<option value="'+FONT_MAP[i][0]+'">'+FONT_MAP[i][1]+'</option>';
  $(id).innerHTML=o;
}
fillFontSelect("sClockFont"); fillFontSelect("sDateFont");

/* ===== 設定値（DEFAULTS）・読み込み保存・apply() ===== */
var DEFAULTS = {
  clockSize:170, dateSize:30, fg:"#EEF1F5", showSec:true, clockFont:"default", dateFont:"default",
  hpos:"flex-start", vpos:"center",
  hourColor:"#EEF1F5", minColor:"#EEF1F5", secColor:"#7E8894",
  dateColor:"#7E8894", dowColor:"#EEF1F5",
  nightOn:true, nightStart:1, nightEnd:6, nightBr:22,
  weatherOn:true, lat:36.0835, lon:140.0764, refresh:15, rainThreshold:50,
  weatherScale:100, tempColor:"#EEF1F5", descColor:"#EEF1F5", hiloColor:"#7E8894", hourFcColor:"#EEF1F5",
  calendarOn:true, calScale:100, calSunColor:"#E8706F", calSatColor:"#6F9EE8", calHolidayColor:"#E8706F",
  portraitAuto:false,
  portraitClockSize:110, portraitDateSize:22, portraitWeatherScale:75, portraitCalScale:75,
  bgOn:true, bgDark:45, bgMorningStart:5, bgDayStart:8, bgEveningStart:17, bgNightStart:19
};
var KEY_S = "dash.settings", KEY_W = "dash.weather";
var S = load();

function load(){
  var s = {};
  for (var k in DEFAULTS) s[k] = DEFAULTS[k];
  try {
    var raw = localStorage.getItem(KEY_S);
    if (raw){ var o = JSON.parse(raw); for (var j in o) if (j in s) s[j] = o[j]; }
  } catch(e){}
  return s;
}
function save(){ try{ localStorage.setItem(KEY_S, JSON.stringify(S)); }catch(e){} }

/* 縦置き／横置きで別々に保存しているサイズ系（時計・日付・天気・カレンダー）だけを反映する。
   向きが切り替わった瞬間にもこれを呼ぶことで、回転直後から正しい大きさで表示される。 */
function applySizeVars(){
  var r = document.documentElement.style;
  r.setProperty("--clock-size",   (isPortrait ? S.portraitClockSize    : S.clockSize)    + "px");
  r.setProperty("--date-size",    (isPortrait ? S.portraitDateSize     : S.dateSize)     + "px");
  r.setProperty("--weather-scale",(isPortrait ? S.portraitWeatherScale : S.weatherScale) / 100);
  r.setProperty("--cal-scale",    (isPortrait ? S.portraitCalScale     : S.calScale)     / 100);
}
function apply(){
  updateOrientation();
  var r = document.documentElement.style;
  applySizeVars();
  r.setProperty("--fg", S.fg);
  r.setProperty("--clock-font", FONT_CSS[S.clockFont] || FONT_CSS.default);
  r.setProperty("--date-font", FONT_CSS[S.dateFont] || FONT_CSS.default);
  r.setProperty("--hpos", S.hpos);
  r.setProperty("--vpos", S.vpos);
  r.setProperty("--talign", S.hpos === "center" ? "center" : (S.hpos === "flex-end" ? "right" : "left"));
  r.setProperty("--hh-color", S.hourColor);
  r.setProperty("--mm-color", S.minColor);
  r.setProperty("--ss-color", S.secColor);
  r.setProperty("--date-md-color", S.dateColor);
  r.setProperty("--date-dow-color", S.dowColor);
  r.setProperty("--temp-color", S.tempColor);
  r.setProperty("--desc-color", S.descColor);
  r.setProperty("--hilo-color", S.hiloColor);
  r.setProperty("--hourfc-color", S.hourFcColor);
  r.setProperty("--cal-sun-color", S.calSunColor);
  r.setProperty("--cal-sat-color", S.calSatColor);
  r.setProperty("--cal-holiday-color", S.calHolidayColor);
  r.setProperty("--bg-dark", S.bgDark / 100);
  updateBackground();
  var g = Math.round(255 * S.nightBr / 100);
  r.setProperty("--night-fg", "rgb(" + g + "," + (g+4) + "," + (g+8) + ")");
  setClass();
  isNight = null; applyNight(new Date());
}
function setClass(){
  var c = [];
  if (!S.showSec) c.push("nosec");
  if (!S.weatherOn) c.push("noweather");
  if (!S.calendarOn) c.push("nocal");
  if (isNight) c.push("night");
  if (isPortrait) { c.push("portrait"); if (S.portraitAuto) c.push("portrait-auto"); }
  document.body.className = c.join(" ");
}
/* ===== 画面の向き（縦置き／横置き）の判定 =====
   向きが実際に変わった瞬間だけ applySizeVars() を呼び直すことで、
   横→縦・縦→横のどちらに回転しても、その向き用に保存した大きさへ自動的に切り替わる。 */
function updateOrientation(){
  var was = isPortrait;
  isPortrait = window.innerHeight > window.innerWidth;
  if (isPortrait !== was) applySizeVars();
  setClass();
}

/* ===== 天気コード（WMO）とアイコンSVG ===== */
var WMO={0:["快晴","sun"],1:["晴れ","sun"],2:["薄曇り","partly"],3:["曇り","cloud"],
45:["霧","fog"],48:["霧","fog"],51:["霧雨","drizzle"],53:["霧雨","drizzle"],55:["霧雨","drizzle"],
56:["着氷性の霧雨","drizzle"],57:["着氷性の霧雨","drizzle"],61:["弱い雨","rain"],63:["雨","rain"],
65:["強い雨","rain"],66:["みぞれ","rain"],67:["みぞれ","rain"],71:["弱い雪","snow"],73:["雪","snow"],
75:["大雪","snow"],77:["霧雪","snow"],80:["にわか雨","rain"],81:["にわか雨","rain"],
82:["激しいにわか雨","rain"],85:["にわか雪","snow"],86:["にわか雪","snow"],
95:["雷雨","storm"],96:["雷雨","storm"],99:["雷雨","storm"]};

/* Yahoo天気などに近い、色分けされた塗りつぶしアイコン（晴れ=オレンジ／曇り=グレー／雨=ブルー／雪=水色／雷=黄色） */
var ICON={
sun:'<circle cx="32" cy="32" r="14" fill="#FFA83C"/><g stroke="#FFA83C" stroke-width="4.5" stroke-linecap="round"><path d="M32 4v8M32 52v8M4 32h8M52 32h8M12.7 12.7l5.6 5.6M45.7 45.7l5.6 5.6M51.3 12.7l-5.6 5.6M18.3 45.7l-5.6 5.6"/></g>',
partly:'<circle cx="23" cy="21" r="10" fill="#FFA83C"/><g stroke="#FFA83C" stroke-width="3.5" stroke-linecap="round"><path d="M23 3v6M3 21h6M8.8 6.8l4.2 4.2M37.2 6.8l-4.2 4.2"/></g><path d="M20 52a12 12 0 0 1 1.2-23.9A15.5 15.5 0 0 1 49 32a10 10 0 0 1-1 20z" fill="#AEB8C4"/>',
cloud:'<path d="M19 48a11 11 0 0 1 1.2-21.9 14.5 14.5 0 0 1 27.5 4.4A9.5 9.5 0 0 1 45 48z" fill="#9AA5B1"/><path d="M17 30a8 8 0 0 1 8-6" fill="none" stroke="#C4CCD6" stroke-width="3" stroke-linecap="round"/>',
fog:'<path d="M19 38a11 11 0 0 1 1.2-21.9 14.5 14.5 0 0 1 27.5 4.4A9.5 9.5 0 0 1 45 38z" fill="#9AA5B1"/><g stroke="#9AA5B1" stroke-width="3.5" stroke-linecap="round"><path d="M12 47h40M18 55h28"/></g>',
drizzle:'<path d="M19 38a11 11 0 0 1 1.2-21.9 14.5 14.5 0 0 1 27.5 4.4A9.5 9.5 0 0 1 45 38z" fill="#A9B4C4"/><g fill="#5AA9E6"><ellipse cx="25" cy="49" rx="2.4" ry="4"/><ellipse cx="39" cy="49" rx="2.4" ry="4"/></g>',
rain:'<path d="M19 36a11 11 0 0 1 1.2-21.9 14.5 14.5 0 0 1 27.5 4.4A9.5 9.5 0 0 1 45 36z" fill="#7C8798"/><g fill="#4FA3E8"><path d="M23 42c-2 3-3 5-3 7a3 3 0 0 0 6 0c0-2-1-4-3-7z"/><path d="M34 42c-2 3-3 5-3 7a3 3 0 0 0 6 0c0-2-1-4-3-7z"/><path d="M45 42c-2 3-3 5-3 7a3 3 0 0 0 6 0c0-2-1-4-3-7z"/></g>',
snow:'<path d="M19 36a11 11 0 0 1 1.2-21.9 14.5 14.5 0 0 1 27.5 4.4A9.5 9.5 0 0 1 45 36z" fill="#A9B4C4"/><g stroke="#EAF3FB" stroke-width="3" stroke-linecap="round"><path d="M23 43v9M18.5 45.5l9 4M27.5 45.5l-9 4"/><path d="M41 43v9M36.5 45.5l9 4M45.5 45.5l-9 4"/></g>',
storm:'<path d="M19 34a11 11 0 0 1 1.2-21.9 14.5 14.5 0 0 1 27.5 4.4A9.5 9.5 0 0 1 45 34z" fill="#5B6472"/><path d="M33 36l-9 13h8l-3 11 12-15h-8z" fill="#FFCC33"/>'};

function svg(n){ return '<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">'+(ICON[n]||ICON.cloud)+'</svg>'; }

/* ===== 背景画像（時間帯＋天気で自動切り替え） ===== */
var BG_IMG = {
  morning:   "images/back-morning.jpg",
  sunny:     "images/back-sunny.jpg",
  clear:     "images/back-clear.jpg",
  cloud:     "images/back-cloud.jpg",
  rain:      "images/back-rain.jpg",
  snow:      "images/back-snow.jpg",
  thunder:   "images/back-thunder.jpg",
  fog:       "images/back-fog.jpg",
  evening:   "images/back-sunset.jpg",
  night:     "images/back-night.jpg",
  nightRain: "images/back-night-rain.jpg",
  nightCloud:"images/back-night-cloud.jpg"
};
var lastWeatherCode=0, bgActive=1, bgCurrentKey=null;
var bgLoaded={}; // 読み込みに成功した画像キーを記録（失敗診断用）

function preloadBackgrounds(){
  var _loop = function(k){
    var im=new Image();
    im.onload=function(){ bgLoaded[k]=true; };
    im.onerror=function(){
      bgLoaded[k]=false;
      console.warn("[背景画像] 読み込み失敗: "+BG_IMG[k]+"（ファイル名の大文字小文字・拡張子・スペースをGitHub上で確認してください）");
    };
    im.src=BG_IMG[k];
  };
  for (var k in BG_IMG) _loop(k);
}
/* 時間帯の判定（朝／昼／夕方／夜、境界は設定パネルで変更可） */
function bgPeriod(h){
  var m=S.bgMorningStart, d=S.bgDayStart, e=S.bgEveningStart, n=S.bgNightStart;
  if (h>=n || h<m) return "night";
  if (h<d) return "morning";
  if (h<e) return "day";
  return "evening";
}
/* 天気コード（WMO）を背景画像用のグループに分類
   優先順位：雷雨・嵐 ＞ 雪 ＞ 濃霧 ＞ 雨 ＞ 快晴／晴れ／曇り */
function weatherBgGroup(code){
  if (code===95 || code===96 || code===99) return "thunder";
  if ([71,73,75,77,85,86].indexOf(code)>=0) return "snow";
  if (code===45 || code===48) return "fog";
  if ([51,53,55,56,57,61,63,65,66,67,80,81,82].indexOf(code)>=0) return "rain";
  if (code===0) return "clear";
  if (code===1) return "sunny";
  return "cloud"; // 2:薄曇り, 3:曇り、および未知コードはここに含める
}
/* 時間帯とグループから、実際に使う背景画像のキーを決定
   朝・夕方は天気に関わらず固定。夜は雨/雷→夜雨、曇り/霧→曇りの夜、それ以外→通常の夜。 */
function bgKeyFor(period,group){
  if (period==="morning") return "morning";
  if (period==="evening") return "evening";
  if (period==="night"){
    if (group==="rain" || group==="thunder") return "nightRain";
    if (group==="cloud" || group==="fog") return "nightCloud";
    return "night";
  }
  if (group==="thunder") return "thunder";
  if (group==="snow") return "snow";
  if (group==="fog") return "fog";
  if (group==="rain") return "rain";
  if (group==="clear") return "clear";
  if (group==="cloud") return "cloud";
  return "sunny";
}
function updateBackground(){
  var b1=$("bg1"), b2=$("bg2");
  if (!S.bgOn){ b1.className="bgLayer"; b2.className="bgLayer"; bgCurrentKey=null; return; }
  var period=bgPeriod(new Date().getHours());
  var group=weatherBgGroup(lastWeatherCode);
  var key=bgKeyFor(period,group);
  if (!BG_IMG[key]){ console.warn("[背景画像] 未定義のキー: "+key); return; }
  if (key===bgCurrentKey) return;
  if (bgLoaded[key]===false){
    console.warn("[背景画像] "+key+"（"+BG_IMG[key]+"）は読み込みに失敗しているため、切り替えをスキップしました");
    return;
  }
  bgCurrentKey=key;
  var nextId = bgActive===1 ? "bg2" : "bg1", curId = bgActive===1 ? "bg1" : "bg2";
  var next=$(nextId);
  next.style.backgroundImage="url('"+BG_IMG[key]+"')";
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      next.className="bgLayer on";
      $(curId).className="bgLayer";
    });
  });
  bgActive = bgActive===1 ? 2 : 1;
}

/* ===== 時計・日付の表示更新 ===== */
var DOW=["日","月","火","水","木","金","土"];
var lastMin=-1,lastDay=-1,isNight=null,isPortrait=false;
function pad(n){ return n<10?"0"+n:""+n; }

function tickClock(){
  var d=new Date(), m=d.getMinutes();
  $("sec").textContent=pad(d.getSeconds());
  if(m!==lastMin){
    lastMin=m;
    $("hh").textContent=pad(d.getHours());
    $("mm").textContent=pad(m);
    applyNight(d);
    updateBackground();
  }
  if(d.getDate()!==lastDay){
    lastDay=d.getDate();
    $("date").innerHTML="<span id=\"md\">"+(d.getMonth()+1)+"月"+d.getDate()+"日</span> <span id=\"dow\">"+DOW[d.getDay()]+"曜日</span>";
    loadHolidays(); renderCalendar();
  }
}

/* ===== カレンダー（月表示・日曜始まり・祝日はholidays-jp APIで判定） ===== */
var HOLIDAYS = {}, holidaysAt = 0;
var HOLIDAY_KEY = "dash.holidays";
function loadHolidays(){
  try{
    var raw = localStorage.getItem(HOLIDAY_KEY);
    if (raw){ var c = JSON.parse(raw); HOLIDAYS = c.data || {}; holidaysAt = c.at || 0; }
  }catch(e){}
  if (Date.now() - holidaysAt < 20*3600000) return; // 20時間以内に取得済みなら再取得しない
  fetch("https://holidays-jp.github.io/api/v1/date.json").then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(obj){
    HOLIDAYS = obj; holidaysAt = Date.now();
    try{ localStorage.setItem(HOLIDAY_KEY, JSON.stringify({at:holidaysAt, data:obj})); }catch(e){}
    renderCalendar();
  })["catch"](function(){ /* 取得失敗時は前回キャッシュ（あれば）のまま、日曜/土曜の色分けのみ表示 */ });
}
function daysInMonth(y, mIdx){ return new Date(y, mIdx+1, 0).getDate(); }
function renderCalendar(){
  var el = $("cal"); if(!el) return;
  var now = new Date(), y = now.getFullYear(), m = now.getMonth();
  var startDow = new Date(y, m, 1).getDay();
  var totalDays = daysInMonth(y, m), prevDays = daysInMonth(y, m-1);
  var cells = [];
  for(var i=0;i<startDow;i++) cells.push({day:prevDays-startDow+1+i, other:true});
  for(var d=1;d<=totalDays;d++){
    var dow=(startDow+d-1)%7;
    var dateStr = y+"-"+pad(m+1)+"-"+pad(d);
    cells.push({day:d, other:false, dow:dow, today:(d===now.getDate()), holiday:!!HOLIDAYS[dateStr]});
  }
  var rem = cells.length % 7;
  if(rem>0) for(var j=1;j<=7-rem;j++) cells.push({day:j, other:true});

  var head = ["日","月","火","水","木","金","土"].map(function(x,i){
    return '<div class="'+(i===0?"sun":i===6?"sat":"")+'">'+x+'</div>';
  }).join("");
  var grid = cells.map(function(c){
    var cls=[];
    if(c.other) cls.push("other");
    if(c.today) cls.push("today");
    if(!c.other){
      if(c.holiday) cls.push("holiday");
      else if(c.dow===0) cls.push("sun");
      else if(c.dow===6) cls.push("sat");
    }
    return '<div class="calCell '+cls.join(" ")+'">'+c.day+'</div>';
  }).join("");
  el.innerHTML='<div class="calHead">'+head+'</div><div class="calGrid">'+grid+'</div>';
}

/* ===== 夜間モードの判定・切り替え ===== */
function inNight(d){
  if(!S.nightOn) return false;
  var h=d.getHours(), s=S.nightStart, e=S.nightEnd;
  if(s===e) return false;
  return s<e ? (h>=s&&h<e) : (h>=s||h<e);
}
function applyNight(d){
  var n=inNight(d);
  if(n===isNight) return;
  isNight=n; setClass();
  if(n) releaseWake(); else requestWake();
}

/* ===== 画面スリープ防止（Wake Lock） ===== */
var wakeLock=null;
function requestWake(){
  if(!("wakeLock" in navigator)) return;
  navigator.wakeLock.request("screen").then(function(w){
    wakeLock=w; w.addEventListener("release",function(){ wakeLock=null; });
  })["catch"](function(){});
}
function releaseWake(){ if(wakeLock){ try{wakeLock.release();}catch(e){} wakeLock=null; } }

/* ===== 天気データの取得・保存・描画 ===== */
var fetchedAt=0, lastError="";
function apiUrl(){
  return "https://api.open-meteo.com/v1/forecast?latitude="+S.lat+"&longitude="+S.lon+
    "&current=temperature_2m,apparent_temperature,weather_code"+
    "&hourly=temperature_2m,weather_code,precipitation_probability"+
    "&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&forecast_days=2";
}
function loadWeather(){
  if(!S.weatherOn) return;
  fetch(apiUrl()).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){
    fetchedAt=Date.now(); lastError="";
    try{ localStorage.setItem(KEY_W,JSON.stringify({at:fetchedAt,data:j})); }catch(e){}
    render(j);
  })["catch"](function(err){
    lastError=(err&&err.message)?err.message:"通信エラー";
    stamp();
  });
}
function restore(){
  try{
    var raw=localStorage.getItem(KEY_W); if(!raw) return;
    var c=JSON.parse(raw); fetchedAt=c.at; render(c.data);
  }catch(e){}
}
function render(w){
  var now=w.current, code=WMO[now.weather_code]||["不明","cloud"];
  lastWeatherCode=now.weather_code; updateBackground();
  $("icon").innerHTML=svg(code[1]);
  $("temp").innerHTML=Math.round(now.temperature_2m)+"<span>°</span>";
  $("desc").textContent=code[0];
  $("hilo").innerHTML="最高 <b>"+Math.round(w.daily.temperature_2m_max[0])+"°</b>　最低 <b>"+
    Math.round(w.daily.temperature_2m_min[0])+"°</b>　体感 <b>"+Math.round(now.apparent_temperature)+"°</b>";

  var h=w.hourly, base=new Date().getHours(), st=-1;
  for(var i=0;i<h.time.length;i++){ if(parseInt(h.time[i].substr(11,2),10)===base){ st=i; break; } }
  if(st<0) st=0;

  var out="";
  for(var k=1;k<=4;k++){
    var j=st+k*3; if(j>=h.time.length) break;
    var hc=WMO[h.weather_code[j]]||["","cloud"], pop=h.precipitation_probability[j];
    out+='<div class="hour"><div class="h">'+parseInt(h.time[j].substr(11,2),10)+'時</div>'+svg(hc[1])+
      '<div class="t">'+Math.round(h.temperature_2m[j])+'°</div>'+
      '<div class="p">'+(pop>=20?pop+"%":"")+'</div></div>';
  }
  $("hours").innerHTML=out;
  checkRain(h,st); stamp();
}
function checkRain(h,st){
  var el=$("alert");
  for(var k=1;k<=6;k++){
    var j=st+k; if(j>=h.time.length) break;
    if(h.precipitation_probability[j]>=S.rainThreshold){
      el.textContent=parseInt(h.time[j].substr(11,2),10)+"時ごろから雨　降水確率 "+h.precipitation_probability[j]+"%";
      el.className="on"; return;
    }
  }
  el.className="";
}
function stamp(){
  var note=$("note");
  if(lastError && location.protocol==="file:"){
    note.textContent="このファイルを file:// で直接開いているため、ブラウザの制限で天気を取得できません。https のサーバーに置くと表示されます。";
    note.className="on";
  } else if(lastError){
    note.textContent="通信に失敗しました（"+lastError+"）。Wi-Fiと日時設定を確認してください。";
    note.className="on";
  } else { note.className=""; }
}

/* ===== 設定パネル（開閉・各項目の反映） ===== */
var backup=null;
function openPanel(){
  backup=JSON.parse(JSON.stringify(S));
  fillPanel(); $("panel").className="on";
}
function closePanel(){ $("panel").className=""; }

function fillPanel(){
  $("sClock").value=S.clockSize; $("vClock").textContent=S.clockSize+"px";
  $("sDate").value=S.dateSize;   $("vDate").textContent=S.dateSize+"px";
  $("sFg").value=S.fg;           $("vFg").textContent=S.fg;
  $("sSec").checked=S.showSec;
  $("sClockFont").value=S.clockFont;
  $("sDateFont").value=S.dateFont;
  $("sHourColor").value=S.hourColor; $("sMinColor").value=S.minColor; $("sSecColor").value=S.secColor;
  $("sDateColor").value=S.dateColor; $("sDowColor").value=S.dowColor;
  $("sNightOn").checked=S.nightOn;
  $("sNightStart").value=S.nightStart; $("sNightEnd").value=S.nightEnd;
  $("sNightBr").value=S.nightBr; $("vNightBr").textContent=S.nightBr+"%";
  $("sWeatherOn").checked=S.weatherOn;
  $("sLat").value=S.lat; $("sLon").value=S.lon;
  $("sRefresh").value=S.refresh; $("sRain").value=S.rainThreshold;
  $("sWeatherScale").value=S.weatherScale; $("vWeatherScale").textContent=S.weatherScale+"%";
  $("sTempColor").value=S.tempColor; $("sDescColor").value=S.descColor;
  $("sHiloColor").value=S.hiloColor; $("sHourFcColor").value=S.hourFcColor;
  $("sPortraitAuto").checked=S.portraitAuto;
  $("sPortraitClock").value=S.portraitClockSize; $("vPortraitClock").textContent=S.portraitClockSize+"px";
  $("sPortraitDate").value=S.portraitDateSize;   $("vPortraitDate").textContent=S.portraitDateSize+"px";
  $("sPortraitWeatherScale").value=S.portraitWeatherScale; $("vPortraitWeatherScale").textContent=S.portraitWeatherScale+"%";
  $("sPortraitCalScale").value=S.portraitCalScale; $("vPortraitCalScale").textContent=S.portraitCalScale+"%";
  $("sBgOn").checked=S.bgOn;
  $("sBgDark").value=S.bgDark; $("vBgDark").textContent=S.bgDark+"%";
  $("sBgMorning").value=S.bgMorningStart; $("sBgDay").value=S.bgDayStart;
  $("sBgEvening").value=S.bgEveningStart; $("sBgNight").value=S.bgNightStart;
  $("sCalOn").checked=S.calendarOn;
  $("sCalScale").value=S.calScale; $("vCalScale").textContent=S.calScale+"%";
  $("sCalSun").value=S.calSunColor; $("sCalSat").value=S.calSatColor; $("sCalHoliday").value=S.calHolidayColor;
  seg("segH",S.hpos); seg("segV",S.vpos);
}
function seg(id,v){
  var b=$(id).getElementsByTagName("button");
  for(var i=0;i<b.length;i++) b[i].className = (b[i].getAttribute("data-v")===v) ? "sel" : "";
}

function bindRange(id,key,valId,unit){
  $(id).addEventListener("input",function(){
    S[key]=parseInt(this.value,10);
    $(valId).textContent=S[key]+unit; apply();
  });
}
bindRange("sClock","clockSize","vClock","px");
bindRange("sDate","dateSize","vDate","px");
bindRange("sNightBr","nightBr","vNightBr","%");
bindRange("sWeatherScale","weatherScale","vWeatherScale","%");
bindRange("sCalScale","calScale","vCalScale","%");
bindRange("sPortraitClock","portraitClockSize","vPortraitClock","px");
bindRange("sPortraitDate","portraitDateSize","vPortraitDate","px");
bindRange("sPortraitWeatherScale","portraitWeatherScale","vPortraitWeatherScale","%");
bindRange("sPortraitCalScale","portraitCalScale","vPortraitCalScale","%");
bindRange("sBgDark","bgDark","vBgDark","%");

$("sFg").addEventListener("input",function(){ S.fg=this.value; $("vFg").textContent=S.fg; apply(); });
$("sSec").addEventListener("change",function(){ S.showSec=this.checked; apply(); });
$("sClockFont").addEventListener("change",function(){ S.clockFont=this.value; apply(); });
$("sDateFont").addEventListener("change",function(){ S.dateFont=this.value; apply(); });

function bindColor(id,key){
  $(id).addEventListener("input",function(){ S[key]=this.value; apply(); });
}
bindColor("sHourColor","hourColor"); bindColor("sMinColor","minColor"); bindColor("sSecColor","secColor");
bindColor("sDateColor","dateColor"); bindColor("sDowColor","dowColor");
bindColor("sTempColor","tempColor"); bindColor("sDescColor","descColor");
bindColor("sHiloColor","hiloColor"); bindColor("sHourFcColor","hourFcColor");
bindColor("sCalSun","calSunColor"); bindColor("sCalSat","calSatColor"); bindColor("sCalHoliday","calHolidayColor");
$("sCalOn").addEventListener("change",function(){ S.calendarOn=this.checked; apply(); });
$("sPortraitAuto").addEventListener("change",function(){ S.portraitAuto=this.checked; apply(); });
$("sBgOn").addEventListener("change",function(){ S.bgOn=this.checked; apply(); });
$("sNightOn").addEventListener("change",function(){ S.nightOn=this.checked; apply(); });
$("sWeatherOn").addEventListener("change",function(){
  S.weatherOn=this.checked; apply(); if(S.weatherOn) loadWeather();
});

(function(){
  var a=$("sNightStart"), b=$("sNightEnd"), o="";
  for(var h=0;h<24;h++) o+='<option value="'+h+'">'+pad(h)+':00</option>';
  a.innerHTML=o; b.innerHTML=o;
  a.addEventListener("change",function(){ S.nightStart=parseInt(this.value,10); apply(); });
  b.addEventListener("change",function(){ S.nightEnd=parseInt(this.value,10); apply(); });
})();

(function(){
  var ids=["sBgMorning","sBgDay","sBgEvening","sBgNight"];
  var keys=["bgMorningStart","bgDayStart","bgEveningStart","bgNightStart"];
  var o=""; for(var h=0;h<24;h++) o+='<option value="'+h+'">'+pad(h)+':00</option>';
  for(var i=0;i<ids.length;i++){
    $(ids[i]).innerHTML=o;
    (function(key){
      $(ids[i]).addEventListener("change",function(){ S[key]=parseInt(this.value,10); apply(); });
    })(keys[i]);
  }
})();

function bindNum(id,key,isFloat){
  $(id).addEventListener("change",function(){
    var v = isFloat ? parseFloat(this.value) : parseInt(this.value,10);
    if(!isNaN(v)) S[key]=v;
  });
}
bindNum("sLat","lat",true); bindNum("sLon","lon",true);
bindNum("sRefresh","refresh"); bindNum("sRain","rainThreshold");

function bindSeg(id,key){
  $(id).addEventListener("click",function(e){
    var v=e.target.getAttribute("data-v"); if(!v) return;
    S[key]=v; seg(id,v); apply();
  });
}
bindSeg("segH","hpos"); bindSeg("segV","vpos");

$("btnSave").addEventListener("click",function(){
  save(); closePanel(); restartTimers(); loadWeather();
});
$("btnCancel").addEventListener("click",function(){
  S=backup; apply(); closePanel();
});
$("btnReset").addEventListener("click",function(){
  S=JSON.parse(JSON.stringify(DEFAULTS)); apply(); fillPanel();
});

/* ===== 操作：長押しで設定パネル、タップで全画面表示 ===== */
var pressTimer=null, longPressed=false;
function startPress(){
  longPressed=false;
  pressTimer=setTimeout(function(){ longPressed=true; openPanel(); },900);
}
function endPress(){ clearTimeout(pressTimer); }
$("screen").addEventListener("touchstart",startPress);
$("screen").addEventListener("touchend",endPress);
$("screen").addEventListener("touchmove",endPress);
$("screen").addEventListener("mousedown",startPress);
$("screen").addEventListener("mouseup",endPress);

$("screen").addEventListener("click",function(){
  if(longPressed) return;
  var e=document.documentElement;
  if(document.fullscreenElement||document.webkitFullscreenElement) return;
  if(e.requestFullscreen) e.requestFullscreen();
  else if(e.webkitRequestFullscreen) e.webkitRequestFullscreen();
});

/* ===== 画面サイズに合わせて拡大縮小（1280×800基準） ===== */
var REF_W=1280, REF_H=800;
function fitStage(){
  updateOrientation();
  if(isPortrait){ $("screen").style.transform="none"; return; }
  var vw=window.innerWidth, vh=window.innerHeight;
  var scale=Math.min(vw/REF_W, vh/REF_H);
  var x=(vw-REF_W*scale)/2, y=(vh-REF_H*scale)/2;
  $("screen").style.transform="translate("+x+"px,"+y+"px) scale("+scale+")";
}
window.addEventListener("resize", fitStage);
window.addEventListener("orientationchange", function(){ setTimeout(fitStage,300); });

/* ===== 起動処理・定期実行タイマー ===== */
var tWeather=null;
function restartTimers(){
  if(tWeather) clearInterval(tWeather);
  tWeather=setInterval(loadWeather, S.refresh*60000);
}

preloadBackgrounds();
apply();
fitStage();
restore();
tickClock();
loadHolidays();
renderCalendar();
loadWeather();
setInterval(tickClock,1000);
setInterval(stamp,60000);
restartTimers();
setTimeout(function(){ var h=$("hint"); if(h) h.style.display="none"; },20000);

document.addEventListener("visibilitychange",function(){
  if(document.visibilityState!=="visible") return;
  lastMin=-1; lastDay=-1; isNight=null;
  tickClock();
  if(!isNight) requestWake();
  if(Date.now()-fetchedAt > S.refresh*60000) loadWeather();
});

setInterval(function(){
  var d=new Date();
  if(d.getHours()===4 && d.getMinutes()===0) location.reload();
},60000);
</script>
